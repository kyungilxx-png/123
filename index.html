<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리끼리 사진첩</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fffbd1;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;background-image:linear-gradient(#ffffff33,#ffffff33),url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80");background-size:cover;background-position:center;background-attachment:fixed;}
button,input,textarea{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.22);backdrop-filter:blur(5px);padding:18px 15px 12px;text-align:center;border-bottom:1px solid rgba(255,255,255,.45)}
.header h1{margin:0;font-family:"Jua","Noto Sans KR",sans-serif;font-size:34px;letter-spacing:2px;font-weight:400;color:#111;text-shadow:0 2px 8px rgba(255,255,255,.75);display:inline-block;padding:2px 18px 7px;border-radius:18px;background:rgba(0,105,145,.18);-webkit-text-stroke:.4px rgba(255,255,255,.7)}.header p{margin:4px 0 0;color:#111;font-weight:700;font-size:12px;text-shadow:0 1px 5px rgba(0,0,0,.35)}
.container{max-width:720px;margin:auto;padding:16px 12px 40px}
.notice{background:#fff8c5;border:1px solid #eee4a0;border-radius:14px;padding:11px 13px;margin-bottom:15px;font-size:12px;line-height:1.55;color:#756d2b}
.big-folder{background:#fff;border:1px solid #eee7b0;border-radius:18px;padding:14px;margin-bottom:16px;box-shadow:0 3px 14px #9992}
.ranking-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ranking-card{background:rgba(255,255,255,.94);border:4px solid #d8bd72;border-radius:16px;padding:7px;box-shadow:0 4px 15px rgba(70,50,20,.28);overflow:hidden}
.ranking-title{text-align:center;font-family:"Jua","Noto Sans KR",sans-serif;font-size:15px;color:#5b431b;margin:2px 0 7px;font-weight:400}
.ranking-photo-wrap{background:#f7f1d8;border-radius:10px;overflow:hidden;position:relative}
.ranking-photo{display:block;width:100%;height:125px;object-fit:cover;cursor:pointer}
.ranking-info{text-align:center;font-size:10px;color:#777;padding:5px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranking-empty{height:125px;display:flex;align-items:center;justify-content:center;text-align:center;color:#aaa;font-size:11px}
@media(max-width:380px){.ranking-card{padding:6px}.ranking-photo{height:105px}.ranking-title{font-size:14px}}
.big-title{font-size:18px;font-weight:800;margin-bottom:10px}.subfolders{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.folder{border:1px solid #eee5a0;background:#fffdf0;border-radius:15px;padding:16px 10px;text-align:left}.folder:active{transform:scale(.98)}
.folder-icon{font-size:24px;display:block;margin-bottom:6px}.folder-name{font-size:15px;font-weight:800}.folder-count{font-size:11px;color:#999;margin-top:4px}
.hidden{display:none!important}.back{border:1px solid #e5dd94;background:#fff;border-radius:11px;padding:9px 12px;margin-bottom:12px}
.path{font-size:13px;color:#777;margin:0 0 13px}.path b{color:#333}
.upload{width:100%;border:0;border-radius:14px;padding:13px;background:#4f6b32;color:#fff;font-weight:800;margin-bottom:15px}
.photo-list{display:flex;flex-direction:column;gap:14px}.post{background:#fff;border:1px solid #eee7b0;border-radius:18px;overflow:hidden;box-shadow:0 3px 14px #9992}
.post img{display:block;width:100%;height:150px;object-fit:cover;background:#f3f3f3;cursor:pointer}.post-body{padding:12px 13px 13px}.desc{font-size:15px;line-height:1.5;white-space:pre-wrap}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}.date{font-size:11px;color:#999}.uploader{font-size:11px;color:#666;font-weight:700}.stats{display:flex;align-items:center;gap:10px;margin-top:9px}.stat{font-size:11px;color:#888}.like{border:1px solid #e5e5e5;background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;color:#666}.like.active{background:#fff3c4;border-color:#f0d36a;color:#8a6800;font-weight:800}.like:active{transform:scale(.97)}
.delete{border:0;background:#f1f1f1;color:#777;border-radius:9px;padding:7px 10px;font-size:11px;margin-top:10px}
.empty{text-align:center;padding:48px 15px;background:#ffffffaa;border:1px dashed #ddd28b;border-radius:18px;color:#999}
.lightbox{position:fixed;inset:0;background:#000e;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.lightbox-panel{position:relative;width:min(720px,100%);max-height:96vh;overflow:auto;background:#111;border-radius:14px;padding:10px}
.lightbox img{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;object-fit:contain;border-radius:8px;margin:0 auto}
.review-box{background:#fff;border-radius:13px;margin-top:10px;padding:12px}
.review-title{font-weight:800;font-size:15px;margin-bottom:9px}
.review-list{display:flex;flex-direction:column;gap:7px;max-height:180px;overflow:auto}
.review-item{background:#f8f8f8;border-radius:10px;padding:8px 10px}
.review-head{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#777;margin-bottom:3px}
.review-writer{font-weight:800;color:#444}
.review-text{font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.review-empty{text-align:center;color:#aaa;font-size:12px;padding:12px}
.review-form{margin-top:9px;border-top:1px solid #eee;padding-top:9px}
.review-form input,.review-form textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:9px;outline:none;font-size:13px}
.review-form textarea{min-height:58px;margin-top:6px;resize:none}
.review-form button{width:100%;border:0;border-radius:10px;padding:10px;margin-top:6px;background:#4f6b32;color:#fff;font-weight:800}
.lightbox-close{position:absolute;top:12px;right:14px;width:42px;height:42px;border:0;border-radius:50%;background:#ffffffdd;color:#333;font-size:25px;line-height:42px;z-index:2}
@media(max-width:600px){.lightbox{padding:7px}.lightbox-panel{max-height:97vh;padding:8px}.lightbox img{max-height:55vh}.review-list{max-height:150px}}
.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:720px;background:#fff;border-radius:23px 23px 0 0;padding:18px 15px 27px}
.sheet h2{margin:0 0 12px;font-size:19px}.preview{width:100%;max-height:300px;object-fit:contain;border-radius:13px;background:#f4f4f4;margin-bottom:11px}
textarea{width:100%;min-height:88px;border:1px solid #ddd;border-radius:12px;padding:11px;resize:none;outline:none}.uploader-input{width:100%;border:1px solid #ddd;border-radius:12px;padding:11px;outline:none;margin-bottom:9px}.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;border:0;border-radius:12px;padding:13px}.cancel{background:#eee}.publish{background:#4f6b32;color:#fff;font-weight:800}
.status{text-align:center;color:#777;font-size:12px;padding:10px}
</style>
</head>
<body>
<header class="header"><h1>우리끼리 사진첩</h1><p>우리 가족 사진첩</p></header>
<main class="container">
  <div id="home">
    <div id="rankingBox" class="ranking-box">
      <div class="ranking-card">
        <div class="ranking-title">🏆 추천 1위 사진</div>
        <div id="likeRanking"></div>
      </div>
      <div class="ranking-card">
        <div class="ranking-title">👑 조회수 1위 사진</div>
        <div id="viewRanking"></div>
      </div>
    </div>
    <div id="connectionNotice" class="notice">☁️ 저장서버 연결 준비중...</div>
    <div class="big-folder"><div class="big-title">📁 박씨</div><div class="subfolders">
      <button class="folder" onclick="openFolder('박채아','park_chae_a')"><span class="folder-icon">📷</span><span class="folder-name">박채아</span><span class="folder-count" id="count-park_chae_a">0장</span></button>
      <button class="folder" onclick="openFolder('박서아','park_seo_a')"><span class="folder-icon">📷</span><span class="folder-name">박서아</span><span class="folder-count" id="count-park_seo_a">0장</span></button>
      <button class="folder" onclick="openFolder('가족','park_family')"><span class="folder-icon">📷</span><span class="folder-name">가족</span><span class="folder-count" id="count-park_family">0장</span></button>
      <button class="folder" onclick="openFolder('시루','park_siru')"><span class="folder-icon">📷</span><span class="folder-name">시루</span><span class="folder-count" id="count-park_siru">0장</span></button>
    </div></div>
    <div class="big-folder"><div class="big-title">📁 김씨</div><div class="subfolders">
      <button class="folder" onclick="openFolder('김진리','kim_jin_ri')"><span class="folder-icon">📷</span><span class="folder-name">김진리</span><span class="folder-count" id="count-kim_jin_ri">0장</span></button>
      <button class="folder" onclick="openFolder('가족','kim_family')"><span class="folder-icon">📷</span><span class="folder-name">가족</span><span class="folder-count" id="count-kim_family">0장</span></button>
    </div></div>
    <div class="big-folder"><div class="big-title">📁 모두</div><div class="subfolders">
      <button class="folder" onclick="openFolder('아무거나','everyone')"><span class="folder-icon">📷</span><span class="folder-name">아무거나</span><span class="folder-count" id="count-everyone">0장</span></button>
      <button class="folder" onclick="openFolder('재밌는사진','everyone_fun')"><span class="folder-icon">📷</span><span class="folder-name">재밌는사진</span><span class="folder-count" id="count-everyone_fun">0장</span></button>
      <button class="folder" onclick="openFolder('맛있는사진','everyone_food')"><span class="folder-icon">📷</span><span class="folder-name">맛있는사진</span><span class="folder-count" id="count-everyone_food">0장</span></button>
      <button class="folder" onclick="openFolder('여행사진','everyone_travel')"><span class="folder-icon">📷</span><span class="folder-name">여행사진</span><span class="folder-count" id="count-everyone_travel">0장</span></button>
    </div></div>
  </div>

  <div id="folderPage" class="hidden">
    <button class="back" onclick="goHome()">← 가족 목록으로</button>
    <div class="path">우리끼리　›　<b id="folderTitle"></b></div>
    <button class="upload" onclick="document.getElementById('photoInput').click()">📷 사진 올리기</button>
    <input id="photoInput" type="file" accept="image/*" class="hidden">
    <div id="status" class="status"></div>
    <div id="photoList" class="photo-list"></div>
  </div>
</main>

<div id="lightbox" class="lightbox hidden" onclick="closeLightbox(event)">
  <div class="lightbox-panel" onclick="event.stopPropagation()">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <img id="lightboxImage" src="" alt="확대된 가족 사진">
    <div class="review-box">
      <div class="review-title">💬 이 사진에 한마디</div>
      <div id="reviewList" class="review-list"><div class="review-empty">리뷰를 불러오는 중...</div></div>
      <div class="review-form">
        <input id="reviewWriter" maxlength="20" placeholder="이름">
        <textarea id="reviewContent" maxlength="300" placeholder="사진에 대한 한마디를 남겨줘 😊"></textarea>
        <button onclick="submitReview()">리뷰 등록</button>
      </div>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="sheet">
  <h2>사진 올리기</h2>
  <img id="preview" class="preview" alt="미리보기">
  <input id="uploaderName" class="uploader-input" maxlength="20" placeholder="올린 사람 이름 (예: 경일)">
  <textarea id="description" placeholder="사진 설명을 간단하게 적어주세요. 예) 채아 생일날 가족사진 ❤️"></textarea>
  <div class="actions"><button class="cancel" onclick="closeModal()">취소</button><button class="publish" onclick="publishPhoto()">게시하기</button></div>
</div></div>

<!-- Supabase JS v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   1) Supabase 프로젝트를 만든 뒤 아래 두 값만 넣으면 됩니다.
   Project URL: https://xxxx.supabase.co
   Publishable key: Supabase Dashboard에서 확인
   절대로 service_role/secret key를 여기에 넣지 마세요.
   ========================================================== */
const SUPABASE_URL = "https://qfsjcncqvsxcvxdjbgzx.supabase.co";
const SUPABASE_KEY = "sb_publishable_ThLq56ySjSJMUkjgbuzknQ_-7PBbBPg";
const BUCKET = "family-photos";

/*
  [추가된 family_posts 컬럼]
  uploader_name text default '이름 없음'
  view_count integer default 0
  like_count integer default 0
  기존 테이블에 위 3개 컬럼을 추가해야 합니다.
*/

let db = null;
let currentFolderName = "";
let currentFolderKey = "";
let selectedFile = null;
let currentReviewPostId = null;

const folders = ["park_chae_a","park_seo_a","park_family","park_siru","kim_jin_ri","kim_family","everyone","everyone_fun","everyone_food","everyone_travel"];

function ready(){
  return SUPABASE_URL.startsWith("https://") &&
         !SUPABASE_URL.includes("여기에_") &&
         !SUPABASE_KEY.includes("여기에_");
}
if(ready()){
  db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  document.getElementById("connectionNotice").textContent="☁️ 사진은 가족 모두가 함께 보는 저장서버에 보관됩니다.";
  refreshCounts();
  loadRankings();
}else{
  document.getElementById("connectionNotice").innerHTML="⚙️ 아직 저장서버 설정 전입니다. <b>Supabase 설정 후</b> 가족 사진을 함께 저장할 수 있습니다.";
}

async function refreshCounts(){
  if(!db)return;
  for(const key of folders){
    const {count,error}=await db.from("family_posts").select("*",{count:"exact",head:true}).eq("folder_key",key);
    const el=document.getElementById("count-"+key);
    if(el)el.textContent=(error?"-":(count||0))+"장";
  }
}

async function loadRankings(){
  const likeEl=document.getElementById("likeRanking");
  const viewEl=document.getElementById("viewRanking");
  if(!likeEl || !viewEl) return;
  if(!db){
    likeEl.innerHTML='<div class="ranking-empty">저장서버 연결 후<br>사진이 표시돼.</div>';
    viewEl.innerHTML='<div class="ranking-empty">저장서버 연결 후<br>사진이 표시돼.</div>';
    return;
  }
  const [likeResult, viewResult] = await Promise.all([
    db.from("family_posts").select("id,image_url,description,uploader_name,like_count,view_count").order("like_count",{ascending:false}).order("created_at",{ascending:false}).limit(1),
    db.from("family_posts").select("id,image_url,description,uploader_name,like_count,view_count").order("view_count",{ascending:false}).order("created_at",{ascending:false}).limit(1)
  ]);
  renderRanking(likeEl, likeResult.data && likeResult.data[0], "추천");
  renderRanking(viewEl, viewResult.data && viewResult.data[0], "조회");
}

function renderRanking(el,p,type){
  if(!p){ el.innerHTML='<div class="ranking-empty">아직 사진이 없어 📷</div>'; return; }
  const count=type==="추천" ? Number(p.like_count||0) : Number(p.view_count||0);
  el.innerHTML=`<div class="ranking-photo-wrap"><img class="ranking-photo" src="${escapeAttr(p.image_url)}" alt="${type} 1위 사진" onclick="viewPhoto('${escapeAttr(p.id)}',this.src)"><div class="ranking-info">${escapeHtml(p.uploader_name||"이름 없음")} · ${type} ${count}</div></div>`;
}
let inFolder=false;

function showFolder(name,key){
  currentFolderName=name; currentFolderKey=key;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("folderPage").classList.remove("hidden");
  document.getElementById("folderTitle").textContent=name;
  inFolder=true;
  if(!db){
    document.getElementById("photoList").innerHTML='<div class="empty">Supabase 설정이 아직 안 됐어.<br>index.html의 설정값을 넣으면 사진 저장이 시작돼.</div>';
    return;
  }
  loadPhotos();
}
function openFolder(name,key){
  if(!inFolder){
    history.pushState({page:"folder",name:name,key:key},"","#"+encodeURIComponent(key));
  }
  showFolder(name,key);
}
function goHome(){
  if(inFolder){
    history.back();
  }else{
    showHome();
  }
}
function showHome(){
  document.getElementById("folderPage").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  inFolder=false;
  refreshCounts();
}
window.addEventListener("popstate",function(){
  if(inFolder) showHome();
});
document.getElementById("photoInput").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file)return;
  if(!file.type.startsWith("image/")){alert("사진 파일만 올려주세요.");return;}
  if(file.size>6*1024*1024){alert("사진은 6MB 이하로 올려주세요.");return;}
  selectedFile=file;
  const reader=new FileReader();
  reader.onload=ev=>{document.getElementById("preview").src=ev.target.result;document.getElementById("description").value="";document.getElementById("uploaderName").value=localStorage.getItem("family_uploader_name")||"";document.getElementById("modal").classList.remove("hidden");};
  reader.readAsDataURL(file); e.target.value="";
});
function closeModal(){selectedFile=null;document.getElementById("uploaderName").value="";document.getElementById("modal").classList.add("hidden");}
async function publishPhoto(){
  if(!db||!selectedFile)return;
  const uploader=document.getElementById("uploaderName").value.trim()||"이름 없음";
   if(uploader!=="이름 없음") localStorage.setItem("family_uploader_name",uploader);
   if(uploader!=="이름 없음") localStorage.setItem("family_uploader_name",uploader);
   const desc=document.getElementById("description").value.trim()||"설명 없음";
  const ext=(selectedFile.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=currentFolderKey+"/"+crypto.randomUUID()+"."+ext;
  setStatus("사진 업로드 중...");
  const {error:upErr}=await db.storage.from(BUCKET).upload(path,selectedFile,{contentType:selectedFile.type,cacheControl:"31536000",upsert:false});
  if(upErr){setStatus("");alert("사진 업로드 실패: "+upErr.message);return;}
  const {data:urlData}=db.storage.from(BUCKET).getPublicUrl(path);
  const {error:dbErr}=await db.from("family_posts").insert({folder_key:currentFolderKey,description:desc,storage_path:path,image_url:urlData.publicUrl,uploader_name:uploader,view_count:0,like_count:0});
  if(dbErr){
    await db.storage.from(BUCKET).remove([path]);
    setStatus("");alert("게시글 저장 실패: "+dbErr.message);return;
  }
  closeModal();setStatus("");await loadPhotos();await refreshCounts();await loadRankings();
}
async function loadPhotos(){
  const list=document.getElementById("photoList"); list.innerHTML='<div class="status">사진 불러오는 중...</div>';
  const {data,error}=await db.from("family_posts").select("*").eq("folder_key",currentFolderKey).order("created_at",{ascending:false});
  if(error){list.innerHTML='<div class="empty">사진을 불러오지 못했어.<br>'+escapeHtml(error.message)+'</div>';return;}
  if(!data.length){list.innerHTML='<div class="empty">아직 사진이 없어.<br>첫 번째 사진을 올려봐 📷</div>';return;}
  list.innerHTML=data.map(p=>`
    <article class="post">
      <img src="${escapeAttr(p.image_url)}" alt="가족 사진" loading="lazy" onclick="viewPhoto('${escapeAttr(p.id)}',this.src)">
      <div class="post-body">
        <div class="desc">${escapeHtml(p.description||"")}</div>
        <div class="meta">
          <div class="uploader">👤 ${escapeHtml(p.uploader_name||"이름 없음")}</div>
          <div class="date">${formatDate(p.created_at)}</div>
        </div>
        <div class="stats">
          <button class="like ${isLiked(p.id)?"active":""}" onclick="likePhoto('${escapeAttr(p.id)}',this)">👍 추천 <span>${Number(p.like_count||0)}</span></button>
          <span class="stat">👁 조회 ${Number(p.view_count||0)}</span>
        </div>
        <button class="delete" onclick="deletePhoto('${escapeAttr(p.id)}','${escapeAttr(p.storage_path)}')">이 사진 삭제</button>
      </div>
    </article>`).join("");
}
function isLiked(id){
  try{return JSON.parse(localStorage.getItem("family_likes")||"[]").includes(String(id));}
  catch(e){return false;}
}

function setLiked(id){
  let arr=[];
  try{arr=JSON.parse(localStorage.getItem("family_likes")||"[]");}catch(e){}
  id=String(id);
  if(!arr.includes(id)){arr.push(id);localStorage.setItem("family_likes",JSON.stringify(arr));}
}

async function likePhoto(id,btn){
  if(!db || isLiked(id)) return;
  const {data,error}=await db.from("family_posts").select("like_count").eq("id",id).single();
  if(error){alert("추천 처리 실패: "+error.message);return;}
  const next=Number(data.like_count||0)+1;
  const {error:updateErr}=await db.from("family_posts").update({like_count:next}).eq("id",id);
  if(updateErr){alert("추천 처리 실패: "+updateErr.message);return;}
  setLiked(id);
  btn.classList.add("active");
  btn.querySelector("span").textContent=next;
}

async function viewPhoto(id,src){
  if(db){
    const {data,error}=await db.from("family_posts").select("view_count").eq("id",id).single();
    if(!error){
      const next=Number(data.view_count||0)+1;
      await db.from("family_posts").update({view_count:next}).eq("id",id);
    }
  }
  openLightbox(src,id);
}

async function deletePhoto(id,path){
  if(!confirm("이 사진을 삭제할까?"))return;
  setStatus("삭제 중...");
  const {error:storageErr}=await db.storage.from(BUCKET).remove([path]);
  if(storageErr){setStatus("");alert("사진 파일 삭제 실패: "+storageErr.message);return;}
  const {error:dbErr}=await db.from("family_posts").delete().eq("id",id);
  if(dbErr){setStatus("");alert("게시글 삭제 실패: "+dbErr.message);return;}
  setStatus("");await loadPhotos();await refreshCounts();await loadRankings();
}
async function openLightbox(src,postId){
  currentReviewPostId = postId || null;
  document.getElementById("lightboxImage").src=src;
  document.getElementById("reviewWriter").value=localStorage.getItem("family_review_name")||localStorage.getItem("family_uploader_name")||"";
  document.getElementById("reviewContent").value="";
  document.getElementById("lightbox").classList.remove("hidden");
  document.body.style.overflow="hidden";
  if(currentReviewPostId) await loadReviews(currentReviewPostId);
}
async function loadReviews(postId){
  const list=document.getElementById("reviewList");
  if(!db){list.innerHTML='<div class="review-empty">저장서버에 연결되지 않았어.</div>';return;}
  list.innerHTML='<div class="review-empty">리뷰 불러오는 중...</div>';
  const {data,error}=await db.from("family_reviews")
    .select("id,writer_name,content,created_at")
    .eq("post_id",postId)
    .order("created_at",{ascending:false});
  if(error){
    list.innerHTML='<div class="review-empty">리뷰를 불러오지 못했어.<br>'+escapeHtml(error.message)+'</div>';
    return;
  }
  if(!data || !data.length){
    list.innerHTML='<div class="review-empty">아직 리뷰가 없어. 첫마디를 남겨봐 😊</div>';
    return;
  }
  list.innerHTML=data.map(r=>`<div class="review-item">
    <div class="review-head"><span class="review-writer">👤 ${escapeHtml(r.writer_name||"이름 없음")}</span><span>${formatDate(r.created_at)}</span></div>
    <div class="review-text">${escapeHtml(r.content||"")}</div>
  </div>`).join("");
}

async function submitReview(){
  if(!db || !currentReviewPostId) return;
  const writer=(document.getElementById("reviewWriter").value.trim()||"이름 없음").slice(0,20);
  const content=document.getElementById("reviewContent").value.trim();
  if(!content){alert("리뷰 내용을 입력해줘.");return;}
  if(content.length>300){alert("리뷰는 300자까지 입력할 수 있어.");return;}
  const btn=document.querySelector(".review-form button");
  btn.disabled=true;
  btn.textContent="등록 중...";
  const {error}=await db.from("family_reviews").insert({
    post_id:currentReviewPostId,
    writer_name:writer,
    content:content
  });
  btn.disabled=false;
  btn.textContent="리뷰 등록";
  if(error){alert("리뷰 등록 실패: "+error.message);return;}
  localStorage.setItem("family_review_name",writer);
  document.getElementById("reviewContent").value="";
  await loadReviews(currentReviewPostId);
}

function closeLightbox(e){
  if(e && e.target && e.target.id!=="lightbox" && !e.target.classList.contains("lightbox-close")) return;
  document.getElementById("lightbox").classList.add("hidden");
  document.getElementById("lightboxImage").src="";
  currentReviewPostId=null;
  document.body.style.overflow="";
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeLightbox();
});

function setStatus(t){document.getElementById("status").textContent=t||"";}
function formatDate(v){return new Date(v).toLocaleString("ko-KR");}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function escapeAttr(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#039;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
